[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ezpi"
dynamic = ["version"]
description = "A simple library to write content to public-inbox repositories"
readme = {file = "README", content-type = "text/x-rst"}
license = "MIT-0"
authors = [
    {name = "Konstantin Ryabitsev", email = "mricon@kernel.org"}
]
keywords = ["git", "lore.kernel.org", "public-inbox"]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://git.kernel.org/pub/scm/utils/ezpi/ezpi.git"
Documentation = "https://ezpi.readthedocs.io/"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
libgit2 = [
    "pygit2>=1.12",
]

[dependency-groups]
dev = [
    "mypy",
    "pyright",
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
ezpi = "ezpi:command"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ezpi.__VERSION__"}

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]
extend-select = [
    "B007",    # https://docs.astral.sh/ruff/rules/unused-loop-control-variable/
    "B904",    # https://docs.astral.sh/ruff/rules/raise-without-from-err/
    "DTZ",     # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "G",       # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "PERF102", # https://docs.astral.sh/ruff/rules/incorrect-dict-iterator/
    "PGH004",  # https://docs.astral.sh/ruff/rules/blanket-noqa/
    "PIE790",  # https://docs.astral.sh/ruff/rules/unnecessary-placeholder/
    "PIE810",  # https://docs.astral.sh/ruff/rules/multiple-starts-ends-with/
    "RET505",  # https://docs.astral.sh/ruff/rules/superfluous-else-return/
    "RET506",  # https://docs.astral.sh/ruff/rules/superfluous-else-raise/
    "RET507",  # https://docs.astral.sh/ruff/rules/superfluous-else-continue/
    "RET508",  # https://docs.astral.sh/ruff/rules/superfluous-else-break/
    "RUF059",  # https://docs.astral.sh/ruff/rules/unused-unpacked-variable/
    "RUF100",  # https://docs.astral.sh/ruff/rules/unused-noqa/
    "SIM103",  # https://docs.astral.sh/ruff/rules/needless-bool/
    "SIM113",  # https://docs.astral.sh/ruff/rules/enumerate-for-loop/
    "SIM118",  # https://docs.astral.sh/ruff/rules/in-dict-keys/
    "SIM201",  # https://docs.astral.sh/ruff/rules/negate-equal-op/
]
flake8-quotes.inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
warn_unreachable = true
# python_version is deliberately NOT pinned here: the venv uv creates uses
# the newest Python that matches `requires-python`, and pinning mypy to an
# older version causes spurious errors when mypy follows imports into
# newer stdlib/3rd-party code (e.g. pytest's internal use of `match`).
# Actual 3.9 compatibility is covered by ci-matrix.sh running the suite on
# every supported interpreter.
# setup.py is a fallback for setuptools < 61; exclude to avoid requiring
# types-setuptools in the dev environment.
exclude = ["^setup\\.py$"]

[tool.pyright]
# pyright automatically ignores virtual environments and other directories, but
# once we specify `exclude`, we're on our own. See
# https://github.com/microsoft/pyright/issues/9057#issuecomment-2366938099.
# ".venv-*" catches the per-interpreter venvs that ci-matrix.sh leaves behind
# (without them, pyright tries to type-check ~40 packages in each one).
exclude = [".venv", ".venv-*", "setup.py"]
typeCheckingMode = "strict"

# Overly strict rules.
reportConstantRedefinition = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

# False positives caused by underscore-prefixed functions used across files.
reportPrivateUsage = false
reportUnusedFunction = false

# Optional-pygit2 pattern: pygit2 is rebound to None on ImportError so the
# library can fall back to the subprocess backend. All real access sites are
# guarded by _use_pygit2(), which pyright does not track.
reportOptionalMemberAccess = false

[tool.ty.src]
# setup.py is a fallback for setuptools < 61 (no PEP 621 support); skip it
# so ty does not need to resolve setuptools in its environment.
exclude = ["setup.py"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
